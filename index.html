<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS Server Intel</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --success: #3fb950;
            --danger: #f85149;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.5);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .stats span {
            background: var(--card-bg);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .stats strong {
            color: var(--text-main);
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border-color: #484f58;
        }

        .card-header {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.02);
        }

        .server-name {
            font-family: monospace;
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--accent);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .status.online .dot { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .status.online { color: var(--success); }

        .status.offline .dot { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
        .status.offline { color: var(--danger); }

        .card-body {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .game-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
        }

        .game-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Vector Icon base styles */
        .icon {
            flex-shrink: 0;
            width: 14px;
            height: 14px;
        }

        .addr-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .addr-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.03);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-family: monospace;
            border: 1px solid var(--border-color);
            width: fit-content;
        }

        .map-name {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(88, 166, 255, 0.1);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid rgba(88, 166, 255, 0.2);
            width: fit-content;
        }

        .roster-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 5px;
            color: var(--text-muted);
        }

        .roster-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .player-tag {
            background: #21262d;
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: var(--text-main);
        }

        .scene-text {
            background: #0d1117;
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-family: monospace;
            color: #a5d6ff;
            white-space: pre-wrap;
            max-height: 100px;
            overflow-y: auto;
        }

        .error-text {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--danger);
            font-size: 0.9rem;
            font-style: italic;
        }

        .card-footer {
            padding: 10px 15px;
            border-top: 1px solid var(--border-color);
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.01);
        }

        /* Custom Scrollbar for inner elements */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>BS Server Intel</h1>
        <div class="stats" id="stats">
            <span>Loading stats...</span>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search servers, IPs, maps, or players...">
        </div>
    </header>

    <main class="grid" id="serverGrid">
        <div class="loading" id="loadingMsg">Fetching live intelligence...</div>
    </main>

    <script>
        // Clean, standard SVGs to replace emojis
        const ICONS = {
            map: `<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>`,
            users: `<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>`,
            alert: `<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`,
            network: `<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>`,
            port: `<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17V9a2 2 0 0 1 2-2h5l2 2h5a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"></path></svg>`,
            build: `<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>`
        };

        let allServers = [];

        // Fetch data on load
        async function fetchData() {
            try {
                const response = await fetch('https://gist.githubusercontent.com/BroBordd/68d9597db082ef352f8160f777b7060a/raw/information.txt?t=' + new Date().getTime());
                if (!response.ok) throw new Error("Failed to fetch from gist");

                const rawData = await response.json();

                // Sort servers: Players > Empty > Offline
                allServers = sortServers(rawData);
                renderUI(allServers);
            } catch (error) {
                document.getElementById('loadingMsg').innerHTML = `
                    <div class="error-text" style="justify-content: center; font-size: 1.1rem; margin-bottom: 8px;">
                        ${ICONS.alert} Error loading data: ${error.message}
                    </div>
                    <small style="color: var(--text-muted)">Make sure the gist is accessible.</small>
                `;
            }
        }

        // Logic for prioritizing server visibility
        function sortServers(servers) {
            return servers.sort((a, b) => {
                const aOnline = !a.info.error;
                const bOnline = !b.info.error;

                // 1. Online vs Offline
                if (aOnline !== bOnline) {
                    return aOnline ? -1 : 1;
                }

                if (aOnline && bOnline) {
                    const aPlayers = a.info.roster ? a.info.roster.length : 0;
                    const bPlayers = b.info.roster ? b.info.roster.length : 0;
                    const aFailed = aPlayers === 0;
                    const bFailed = bPlayers === 0;

                    // 2. Fetch-failed (empty roster) always sinks to the bottom
                    if (aFailed !== bFailed) {
                        return aFailed ? 1 : -1;
                    }
                    if (aFailed && bFailed) {
                        return 0;
                    }

                    // 3. Known game > Lobby > Idle/Unknown
                    const rank = (server) => {
                        const name = server.info.game_name;
                        if (!name || name === 'Idle') return 2;
                        if (name === 'Lobby') return 1;
                        return 0; // known game
                    };
                    const aRank = rank(a);
                    const bRank = rank(b);
                    if (aRank !== bRank) {
                        return aRank - bRank;
                    }

                    // 4. Same tier, sort by player count (descending)
                    return bPlayers - aPlayers;
                }

                return 0; // Keep relative position if counts are equal
            });
        }

        // Render the Grid and Stats
        function renderUI(servers) {
            const grid = document.getElementById('serverGrid');
            const stats = document.getElementById('stats');

            grid.innerHTML = '';

            let onlineCount = 0;
            let totalPlayers = 0;

            if (servers.length === 0) {
                grid.innerHTML = '<div class="loading">No servers match your search.</div>';
            }

            const html = servers.map(server => {
                const isOnline = !server.info.error;
                if (isOnline) {
                    onlineCount++;
                    totalPlayers += (server.info.roster ? server.info.roster.length : 0);
                }
                return buildCardHTML(server, isOnline);
            }).join('');

            if (servers.length > 0) grid.innerHTML = html;

            // Update stats
            stats.innerHTML = `
                <span>Total: <strong>${allServers.length}</strong></span>
                <span>Online: <strong>${onlineCount}</strong></span>
                <span>Players: <strong>${totalPlayers}</strong></span>
            `;
        }

        // Generate HTML for a single card
        function buildCardHTML(server, isOnline) {
            const info = server.info || {};
            let bodyHTML = '';

            const addrRowHTML = `
                <div class="addr-row">
                    <span class="addr-pill">${ICONS.network} ${escapeHTML(server.ip)}</span>
                    <span class="addr-pill">${ICONS.port} ${escapeHTML(String(server.port))}</span>
                </div>
            `;

            if (isOnline) {
                const roster = info.roster || [];
                const rosterHTML = roster.map(p => `<span class="player-tag">${escapeHTML(p)}</span>`).join('');
                const sceneTextHTML = info.scene_text ? `<pre class="scene-text">${escapeHTML(info.scene_text)}</pre>` : '';

                // --- NEW LOBBY DETECTION LOGIC ---
                let gameName = info.game_name || 'Unknown Game';

                // Use single quotes here so JS doesn't try to interpolate ${A} as a variable
                const lobbyIndicator = '{"v":"${A}:","s":[["${A}",{"r":"controlsText"}]]}';

                // If it's unknown, check if the extra data string exists anywhere in the server object
                if (gameName === 'Unknown Game' && JSON.stringify(server).includes(lobbyIndicator)) {
                    gameName = 'Lobby';
                }
                // ---------------------------------

                bodyHTML = `
                    ${addrRowHTML}
                    <div class="game-title">${escapeHTML(gameName)}</div>
                    ${info.map_name ? `<div class="map-name">${ICONS.map} ${escapeHTML(info.map_name)}</div>` : ''}
                    ${info.game_desc ? `<div class="game-desc">${escapeHTML(info.game_desc)}</div>` : ''}

                    ${roster.length > 0 ? `
                        <div class="roster-title">${ICONS.users} Players (${roster.length})</div>
                        <div class="roster-list">${rosterHTML}</div>
                    ` : `<div class="error-text">${ICONS.alert} Failed to get info</div>`}

                    ${sceneTextHTML}
                `;
            } else {
                bodyHTML = `
                    ${addrRowHTML}
                    <div class="error-text">
                        ${ICONS.alert} ${escapeHTML(info.error || 'Unknown Error')}
                    </div>
                `;
            }

            const displayName = server.name && String(server.name).trim()
                ? server.name
                : `${server.ip}:${server.port}`;

            return `
                <div class="card">
                    <div class="card-header">
                        <span class="server-name">${escapeHTML(String(displayName))}</span>
                        <div class="status ${isOnline ? 'online' : 'offline'}">
                            <div class="dot"></div>
                            ${isOnline ? 'Online' : 'Offline'}
                        </div>
                    </div>
                    <div class="card-body">
                        ${bodyHTML}
                    </div>
                    <div class="card-footer">
                        ${ICONS.build} Build: ${escapeHTML(String(server.build || 'N/A'))}
                    </div>
                </div>
            `;
        }

        // Quick HTML Escaper to prevent XSS
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g,
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        // Real-time Global Search
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allServers.filter(server => {
                return JSON.stringify(server).toLowerCase().includes(query);
            });
            // The filtered array is inherently sorted because allServers is already sorted
            renderUI(filtered);
        });

        // Initialize
        fetchData();
    </script>
</body>
</html>
